<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <!-- Paints the saved theme before the bundle loads, so a reload never
         flashes light. src/lib/theme.ts owns the key and takes over after. -->
    <script>
      ;(function () {
        try {
          var saved = localStorage.getItem('doop-theme')
          var dark = saved === 'dark' || (saved !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches)
          document.documentElement.classList.toggle('dark', dark)
          document.documentElement.style.colorScheme = dark ? 'dark' : 'light'
        } catch (e) {}
      })()
    </script>
    <title>K17 — Prototype &amp; Design Studio</title>
    <meta
      name="description"
      content="K17 — Nền tảng dựng prototype &amp; thiết kế sản phẩm cùng AI."
    />
    <meta property="og:title" content="K17 — Prototype &amp; Design Studio" />
    <meta
      property="og:description"
      content="K17 — Nền tảng dựng prototype &amp; thiết kế sản phẩm cùng AI."
    />
    <meta property="og:type" content="website" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Hanken+Grotesk:wght@300&family=Geist+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <link

      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 200 200'%3E%3Crect width='200' height='200' rx='48' fill='%23111110'/%3E%3Ctext x='100' y='128' text-anchor='middle' font-family='Inter,system-ui,sans-serif' font-weight='800' font-size='84' letter-spacing='-4' fill='%23fdfdfc'%3EK17%3C/text%3E%3C/svg%3E"
    />
  </head>

  </body>
</html>
